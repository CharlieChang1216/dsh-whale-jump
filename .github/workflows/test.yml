name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 插件没有构建步骤、也没有运行时依赖：源码就是发布物。
      # 测试只用到 node 内置模块，所以这里不需要 install。
      - name: 语法检查
        run: |
          node --check lib/client.js
          node --check lib/index.js

      - name: 契约与引擎测试
        run: |
          node _study/test-client.cjs
          node _study/test-engine.cjs

      - name: 端到端与功能测试
        run: |
          node _study/test-e2e.cjs
          node _study/test-features.cjs

      - name: 氧气与灯塔测试
        run: |
          node _study/test-oxygen.cjs
          node _study/test-spire.cjs

      - name: 语言跟随测试
        run: node _study/test-i18n.cjs

      - name: 清单自检
        run: node _study/test-manifest.cjs
